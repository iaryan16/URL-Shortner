<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium URL Shortener - Fast, secure, and beautiful link management">
    <title>Linkify | Premium Link Management</title>
    <!-- Outfit Font for premium tech feel -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-mesh">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="noise-overlay"></div>
    </div>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-link"></i>
            <span>Linkify.</span>
        </div>
        <div class="nav-links">
            <a href="#" class="active">Home</a>
            <a href="#">Features</a>
            <a href="#">API</a>
        </div>
    </nav>

    <div class="layout-wrapper">
        <div class="hero-section">
            <h1 class="hero-title">
                Link Management, <br>
                <span class="text-gradient">Simplified.</span>
            </h1>
            <p class="hero-subtitle">
                Create secure, trackable short URLs in seconds.
            </p>
        </div>

        <div class="app-section">
            <div class="app-card">
                <div class="card-header">
                    <div class="tabs">
                        <button class="tab-btn active" data-target="shorten-tab">Shorten</button>
                        <button class="tab-btn" data-target="status-tab">Analytics</button>
                    </div>
                </div>

                <div class="card-body">
                    <!-- Shorten Tab -->
                    <section id="shorten-tab" class="tab-content active">
                        <form id="shorten-form" class="modern-form">
                            <div class="input-wrapper main-input">
                                <i class="fa-solid fa-link input-icon"></i>
                                <input type="url" id="original-url" placeholder="Paste your long URL..." required>
                            </div>
                            
                            <div class="input-row">
                                <div class="input-wrapper">
                                    <i class="fa-solid fa-wand-magic-sparkles input-icon"></i>
                                    <input type="text" id="custom-code" placeholder="Custom Alias (optional)">
                                </div>
                                <div class="input-wrapper">
                                    <i class="fa-regular fa-clock input-icon"></i>
                                    <input type="datetime-local" id="expiry-at" title="Expiry Date (optional)">
                                </div>
                            </div>

                            <button type="submit" id="submit-btn" class="glow-btn">
                                <span>Generate Link</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>

                        <div id="result-container" class="result-box hidden">
                            <div class="success-icon-wrapper">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <h4>Ready to Share!</h4>
                            <div class="copy-box">
                                <a href="#" id="short-url-link" target="_blank"></a>
                                <button type="button" id="copy-btn" title="Copy to clipboard">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>
                        </div>
                    </section>

                    <!-- Status Tab -->
                    <section id="status-tab" class="tab-content">
                        <form id="status-form" class="modern-form">
                            <div class="input-wrapper main-input">
                                <i class="fa-solid fa-chart-pie input-icon"></i>
                                <input type="text" id="status-code" placeholder="Enter short code or URL..." required>
                            </div>
                            <button type="submit" class="glow-btn secondary-glow">
                                <span>View Analytics</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>

                        <div id="status-result" class="analytics-dashboard hidden">
                            <div class="analytics-header">
                                <span class="pulse-dot"></span> Live Stats
                            </div>
                            <div class="stats-grid">
                                <div class="stat-box">
                                    <div class="box-icon clicks"><i class="fa-solid fa-mouse-pointer"></i></div>
                                    <div class="box-value" id="stat-clicks">0</div>
                                    <div class="box-label">Total Clicks</div>
                                </div>
                                <div class="stat-box">
                                    <div class="box-icon dates"><i class="fa-solid fa-calendar-check"></i></div>
                                    <div class="box-value small" id="stat-created">-</div>
                                    <div class="box-label">Created</div>
                                </div>
                                <div class="stat-box">
                                    <div class="box-icon dates"><i class="fa-solid fa-hourglass-end"></i></div>
                                    <div class="box-value small" id="stat-expiry">-</div>
                                    <div class="box-label">Expires</div>
                                </div>
                            </div>
                            <div class="target-url-box">
                                <span>Target:</span>
                                <a href="#" id="stat-original" target="_blank"></a>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast hidden"></div>
    <script src="app.js"></script>
</body>
</html>
